# MarketPulse 生产 nginx 样例(邀请制 VPS, ~100 并发)
# 作用: TLS + HTTP/2(解决浏览器 6 连接上限 W10) + 限流 + SSE 长连代理。
# 部署时填: server_name / 证书路径。前端 next start(3000), api uvicorn(8787)。

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream mp_api {
    server 127.0.0.1:8787;   # api 多 worker 由 uvicorn --workers 自管, 单 upstream 即可
    keepalive 32;
}

server {
    listen 80;
    server_name your.domain;
    return 301 https://$host$request_uri;   # 强制 HTTPS
}

server {
    listen 443 ssl http2;                   # ← HTTP/2: 一条连接多路复用, 消除 6 连接上限(W10)
    server_name your.domain;

    ssl_certificate     /etc/letsencrypt/live/your.domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain/privkey.pem;

    # --- 前端 (Next.js next start, 默认 3000) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSE: 必须关缓冲 + 长超时 + h1.1 到 upstream ---
    location /api/sse/ {
        proxy_pass http://mp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';      # 长连保持
        proxy_buffering off;                 # SSE 不能缓冲
        proxy_read_timeout 1h;               # 长连不被读超时掐断
        proxy_set_header Host $host;
    }

    # --- 其余 API: 每 IP 限流(防刷) ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://mp_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
